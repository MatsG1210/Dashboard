<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bureau · Maasdijk</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --fs: 1.5;   /* TEKSTGROOTTE: 1 = klein, 1.5 = standaard, 1.7 = groot */
    --glass: rgba(30,30,34,.52);
    --glass-strong: rgba(24,24,28,.70);
    --stroke: rgba(255,255,255,.12);
    --text: rgba(255,255,255,.94);
    --sub: rgba(235,235,245,.60);
    --faint: rgba(235,235,245,.30);
    --blue:#0a84ff; --orange:#ff9f0a; --red:#ff453a; --green:#30d158; --teal:#64d2ff; --purple:#bf5af2; --yellow:#ffd60a;
    --r: 2.6vh;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;user-select:none}
  html{background:#0b1026}

  /* ---------- wallpaper ---------- */
  #wall{position:fixed;inset:-10%;z-index:-1;
    background:
      radial-gradient(40% 50% at 18% 22%, #3b5bdb 0%, transparent 70%),
      radial-gradient(45% 55% at 82% 18%, #9c36b5 0%, transparent 70%),
      radial-gradient(50% 60% at 70% 88%, #e8590c 0%, transparent 70%),
      radial-gradient(45% 55% at 20% 85%, #0c8599 0%, transparent 70%),
      linear-gradient(160deg,#101a4a,#1a0f3a 55%,#2a1030);
    filter:saturate(1.1);
    animation:drift 120s ease-in-out infinite alternate}
  @keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-3%,2%) scale(1.06)}}

  /* ---------- menubalk ---------- */
  #menubar{height:3.6vh;display:flex;align-items:center;gap:2.2vh;padding:0 1.8vh;font-size:calc(1.65vh*var(--fs));font-weight:500;
    background:rgba(20,20,30,.38);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
    border-bottom:1px solid rgba(255,255,255,.06)}
  #menubar .brand{font-weight:700;display:flex;align-items:center;gap:.8vh}
  #menubar .brand i{width:1.5vh;height:1.5vh;border-radius:50%;background:conic-gradient(var(--teal),var(--purple),var(--orange),var(--teal));display:inline-block}
  #menubar .m{color:rgba(255,255,255,.85);font-weight:400}
  #menubar .grow{flex:1}
  .st{display:flex;align-items:center;gap:.5vh;color:rgba(255,255,255,.75);font-weight:400}
  .st i{width:.8vh;height:.8vh;border-radius:50%;background:#888}
  .st i.ok{background:var(--green)} .st i.err{background:var(--red)} .st i.wait{background:var(--orange)}
  #dimBtn{cursor:pointer;font-size:calc(1.9vh*var(--fs));padding:0 .4vh}
  #mbClock{font-variant-numeric:tabular-nums}

  /* ---------- grid ---------- */
  .grid{display:grid;height:calc(100vh - 3.6vh);padding:1.6vh;gap:1.6vh;
    grid-template-columns:27% 1fr; grid-template-rows:58% 1fr;
    grid-template-areas:"left top" "left bottom"}
  .left{grid-area:left;display:flex;flex-direction:column;gap:1.6vh;min-height:0}
  .top{grid-area:top;display:flex;gap:1.6vh;min-height:0}
  .bottom{grid-area:bottom;min-height:0;display:flex}

  .w{background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r);
     backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);
     box-shadow:0 1.2vh 4vh rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.06);
     padding:1.9vh 2.1vh;position:relative;overflow:hidden;min-height:0}
  .wt{font-size:calc(1.45vh*var(--fs));font-weight:600;letter-spacing:.02em;color:var(--sub);text-transform:uppercase;margin-bottom:1vh;display:flex;justify-content:space-between;align-items:center;gap:1vh}
  .wt b{color:var(--text);font-weight:600;text-transform:none;letter-spacing:0}

  /* ---------- klok + kalender ---------- */
  .row2{display:flex;gap:1.6vh;height:19vh;flex:0 0 auto}
  .row2 .w{flex:1;padding:1.4vh;display:flex;align-items:center;justify-content:center}
  #analog{height:100%;aspect-ratio:1}
  .cal{flex-direction:column;align-items:flex-start!important;justify-content:flex-start!important;padding:1.6vh 1.9vh!important}
  #calDay{color:var(--red);font-weight:700;font-size:calc(1.6vh*var(--fs));text-transform:uppercase;letter-spacing:.04em}
  #calNum{font-size:calc(4.6vh*var(--fs));font-weight:300;line-height:1;margin:.2vh 0}
  #calMonth{font-size:calc(1.75vh*var(--fs));color:var(--sub);text-transform:capitalize}
  #calWeek{font-size:calc(1.45vh*var(--fs));color:var(--faint);margin-top:auto}

  /* ---------- weer (macOS-stijl) ---------- */
  #weather{flex:0 0 auto;height:34vh;display:flex;flex-direction:column;border:none;
    background:linear-gradient(180deg,#2f80ed,#56a0f5);transition:background 2s}
  #weather.night{background:linear-gradient(180deg,#0f1b3d,#28396b)}
  #weather.cloudy{background:linear-gradient(180deg,#5b6b82,#8495ad)}
  #weather.cloudy.night{background:linear-gradient(180deg,#232b3b,#414c61)}
  #weather.rain{background:linear-gradient(180deg,#3f4d63,#64748b)}
  #weather.rain.night{background:linear-gradient(180deg,#1b2230,#384357)}
  .wx-top{display:flex;justify-content:space-between}
  #wxCity{font-size:calc(2vh*var(--fs));font-weight:600}
  #wxTemp{font-size:calc(6.4vh*var(--fs));font-weight:300;line-height:1;margin-top:.3vh;letter-spacing:-.02em}
  #wxIcon{font-size:calc(4vh*var(--fs));text-align:right}
  #wxDesc{font-size:calc(1.75vh*var(--fs));font-weight:600;text-align:right;margin-top:.4vh}
  #wxHL{font-size:calc(1.75vh*var(--fs));font-weight:500;text-align:right;color:rgba(255,255,255,.85)}
  #wxMeta{display:flex;flex-wrap:wrap;gap:.4vh 1.6vh;white-space:nowrap;margin-bottom:1vh;font-size:calc(1.5vh*var(--fs));color:rgba(255,255,255,.8);margin-top:.8vh}
  #hourly{display:grid;grid-template-columns:repeat(6,1fr);margin-top:auto;text-align:center;border-top:1px solid rgba(255,255,255,.22);padding-top:1.1vh}
  #hourly .h{font-size:calc(1.5vh*var(--fs));font-weight:600;color:rgba(255,255,255,.85)}
  #hourly .i{font-size:calc(2.2vh*var(--fs));margin:.4vh 0}
  #hourly .t{font-size:calc(1.9vh*var(--fs));font-weight:600}
  #hourly .p{font-size:calc(1.3vh*var(--fs));color:#bfe3ff;font-weight:600;min-height:1.6vh}

  /* ---------- radar + regen ---------- */
  #radarW{flex:1;display:flex;flex-direction:column}
  #radarBox{flex:1;min-height:0;border-radius:1.6vh;overflow:hidden;background:rgba(0,0,0,.25);position:relative}
  #radar{width:100%;height:100%;object-fit:cover;object-position:28% 58%;display:block}
  #radarErr{display:none;position:absolute;inset:0;align-items:center;justify-content:center;color:var(--sub);font-size:calc(1.6vh*var(--fs));text-align:center;padding:2vh}
  #rainText{font-size:calc(1.8vh*var(--fs));font-weight:600;margin-top:1.2vh}
  #rainBars{display:flex;align-items:flex-end;gap:.5vh;height:4.6vh;margin-top:.8vh}
  #rainBars div{flex:1;background:var(--teal);border-radius:.5vh .5vh .15vh .15vh;min-height:3px}
  #rainAxis{display:flex;justify-content:space-between;font-size:calc(1.3vh*var(--fs));color:var(--faint);margin-top:.4vh;font-variant-numeric:tabular-nums}

  /* ---------- nieuws ---------- */
  #newsW{flex:1.55;display:flex;flex-direction:column}
  .news-body{flex:1;display:flex;gap:2vh;min-height:0}
  #feat{flex:0 0 46%;display:flex;flex-direction:column;min-height:0;cursor:pointer}
  #featImg{width:100%;flex:1 1 0;min-height:0;border-radius:1.4vh;object-fit:cover;background:rgba(255,255,255,.06);display:block}
  #featTitle{font-size:calc(2.15vh*var(--fs));font-weight:700;line-height:1.2;margin-top:1.2vh;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;flex:0 0 auto}
  #featDesc{font-size:calc(1.65vh*var(--fs));color:var(--sub);line-height:1.35;margin-top:.7vh;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;flex:0 0 auto}
  #featMeta{font-size:calc(1.4vh*var(--fs));color:var(--faint);padding-top:.8vh}
  #dots{display:flex;gap:.6vh;margin-top:.8vh}
  #dots span{width:.7vh;height:.7vh;border-radius:50%;background:var(--faint)}
  #dots span.on{background:var(--text)}
  #newsList{flex:1;list-style:none;margin:0;padding:0;overflow:hidden}
  #newsList li{padding:1vh 0;border-top:1px solid rgba(255,255,255,.08);font-size:calc(1.8vh*var(--fs));line-height:1.3;font-weight:500;display:flex;gap:1.2vh}
  #newsList li:first-child{border-top:none;padding-top:0}
  #newsList .ago{flex:0 0 7vh;white-space:nowrap;font-size:calc(1.4vh*var(--fs));color:var(--faint);font-weight:500;padding-top:.25vh;font-variant-numeric:tabular-nums}
  .fade{animation:fade .7s ease}
  @keyframes fade{from{opacity:0;transform:translateY(.5vh)}to{opacity:1;transform:none}}
  .nos{background:#e61e14;color:#fff;font-weight:800;font-size:calc(1.3vh*var(--fs));padding:.2vh .7vh;border-radius:.5vh;letter-spacing:.04em}

  /* ---------- weetjes ---------- */
  #factW{flex:1;display:flex;flex-direction:column;cursor:pointer}
  #factKind{font-size:calc(1.45vh*var(--fs));font-weight:600;color:var(--orange)}
  #factImg{width:100%;height:13vh;object-fit:cover;border-radius:1.4vh;margin:1vh 0 0;display:none}
  #factTitle{font-size:calc(2.2vh*var(--fs));font-weight:700;margin-top:1vh;line-height:1.2}
  #factText{font-size:calc(1.85vh*var(--fs));line-height:1.4;margin-top:.8vh;color:rgba(255,255,255,.88);overflow:hidden;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical}
  #factBar{position:absolute;left:2.1vh;right:2.1vh;bottom:1.4vh;height:.35vh;border-radius:1vh;background:rgba(255,255,255,.1);overflow:hidden}
  #factBar div{height:100%;width:0;background:var(--orange);border-radius:1vh}

  /* ---------- vluchten ---------- */
  #flightW{flex:1;padding:0;display:flex}
  #mapWrap{flex:1;position:relative}
  #map{position:absolute;inset:0;background:#0d1117}
  #flSide{flex:0 0 34%;padding:1.8vh 2vh;display:flex;flex-direction:column;background:var(--glass-strong);border-left:1px solid var(--stroke)}
  .flStats{display:flex;gap:2.4vh;margin-bottom:1.2vh}
  .flStats>div{min-width:0}
  .flStats .n{font-size:calc(3.2vh*var(--fs));font-weight:700;line-height:1;white-space:nowrap}
  .flStats .l{font-size:calc(1.3vh*var(--fs));color:var(--sub);margin-top:.3vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:14vh}
  #flTable{font-variant-numeric:tabular-nums;overflow:hidden}
  .fl{padding:.75vh 0;border-top:1px solid rgba(255,255,255,.07)}
  .fl:first-child{border-top:none;padding-top:0}
  .fl .a,.fl .b{display:flex;justify-content:space-between;gap:1vh;white-space:nowrap}
  .fl .a{font-size:calc(1.65vh*var(--fs))}
  .fl .b{font-size:calc(1.45vh*var(--fs));color:var(--sub);margin-top:.25vh}
  .fl .cs{font-weight:700}
  .fl .ty{color:var(--sub);font-weight:400;margin-left:.6vh}
  .fl .route{overflow:hidden;text-overflow:ellipsis}
  .fl .route b{color:var(--text);font-weight:600}
  .fl .r{color:var(--sub)}
  #flMsg{font-size:calc(1.5vh*var(--fs));color:var(--sub);margin-top:auto;padding-top:.6vh}
  .plane-label{background:none;border:none;box-shadow:none;color:#fff;font:600 16px var(--font);text-shadow:0 0 3px #000,0 0 3px #000;padding:0}
  .plane-label:before{display:none}
  .leaflet-control-attribution{background:rgba(0,0,0,.45)!important;color:rgba(255,255,255,.4)!important;font-size:10px!important}
  .leaflet-control-attribution a{color:rgba(255,255,255,.55)!important}
  .legend{position:absolute;left:1.4vh;bottom:1.4vh;z-index:500;display:flex;gap:1.2vh;font-size:calc(1.3vh*var(--fs));padding:.6vh 1.2vh;border-radius:1vh;
    background:rgba(20,20,26,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--stroke)}
  .legend span:before{content:'';display:inline-block;width:.9vh;height:.9vh;border-radius:50%;margin-right:.5vh;background:var(--c)}

  /* ---------- nachtdimmer ---------- */
  #dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 2s;z-index:9999}
  #dim.on{opacity:.72;pointer-events:auto}
</style>
</head>
<body>
<div id="wall"></div>

<div id="menubar">
  <span class="brand"><i></i>Bureau</span>
  <span class="m">Weer</span><span class="m">Nieuws</span><span class="m">Vluchten</span>
  <span class="grow"></span>
  <span class="st"><i id="sWeather" class="wait"></i>weer</span>
  <span class="st"><i id="sRadar" class="wait"></i>radar</span>
  <span class="st"><i id="sNews" class="wait"></i>NOS</span>
  <span class="st"><i id="sFlights" class="wait"></i>vluchten</span>
  <span id="dimBtn" title="Nachtstand">☾</span>
  <span id="mbClock">–</span>
</div>

<div class="grid">
  <!-- LINKS -->
  <div class="left">
    <div class="row2">
      <div class="w"><svg id="analog" viewBox="0 0 100 100"></svg></div>
      <div class="w cal">
        <div id="calDay">–</div>
        <div id="calNum">–</div>
        <div id="calMonth">–</div>
        <div id="calWeek">–</div>
      </div>
    </div>

    <div class="w" id="weather">
      <div class="wx-top">
        <div>
          <div id="wxCity">Maasdijk ➤</div>
          <div id="wxTemp">--°</div>
        </div>
        <div>
          <div id="wxIcon">·</div>
          <div id="wxDesc">laden…</div>
          <div id="wxHL"></div>
        </div>
      </div>
      <div id="wxMeta"></div>
      <div id="hourly"></div>
    </div>

    <div class="w" id="radarW">
      <div class="wt">Buienradar <b id="radarTime"></b></div>
      <div id="radarBox">
        <img id="radar" alt="">
        <div id="radarErr">Radarbeeld kon niet laden.<br>Nieuwe poging over 5 minuten.</div>
      </div>
      <div id="rainText">–</div>
      <div id="rainBars"></div>
      <div id="rainAxis"></div>
    </div>
  </div>

  <!-- RECHTSBOVEN -->
  <div class="top">
    <div class="w" id="newsW">
      <div class="wt"><span><span class="nos">NOS</span>&nbsp; Nieuws</span><b id="newsUpd"></b></div>
      <div class="news-body">
        <div id="feat">
          <img id="featImg" alt="">
          <div id="featTitle">Nieuws laden…</div>
          <div id="featDesc"></div>
          <div id="featMeta"></div>
          <div id="dots"></div>
        </div>
        <ul id="newsList"></ul>
      </div>
    </div>
  </div>

  <!-- ONDER -->
  <div class="bottom">
    <div class="w" id="flightW">
      <div id="mapWrap">
        <div id="map"></div>
        <div class="legend">
          <span style="--c:#ff9f0a">&lt;1 km</span><span style="--c:#ffd60a">1–3</span><span style="--c:#30d158">3–7</span><span style="--c:#64d2ff">7–10</span><span style="--c:#bf5af2">&gt;10 km</span>
        </div>
      </div>
      <div id="flSide">
        <div class="wt" style="margin-bottom:1.2vh">Boven je hoofd <b id="flSrc"></b></div>
        <div id="flTable"></div>
        <div id="flMsg"></div>
      </div>
    </div>
  </div>
</div>
<div id="dim"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ===================== INSTELLINGEN ===================== */
const HOME = { lat: 51.957, lon: 4.212, name: 'Maasdijk' };
const FLIGHT_RADIUS_NM = 40;          // straal voor vliegtuigen (zeemijl, ~74 km)
const LABEL_RADIUS_KM = 30;           // callsign-labels binnen deze afstand
const NIGHT_FROM = 23, NIGHT_TO = 7;  // automatisch dimmen
const FACT_SECONDS = 50;              // hoe lang een weetje blijft staan
const NEWS_FEATURE_SECONDS = 15;      // hoe lang een uitgelicht nieuwsbericht blijft staan

/* ===================== HULPFUNCTIES ===================== */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const hhmm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
function withTimeout(ms) { const c = new AbortController(); const t = setTimeout(() => c.abort(), ms); return [c.signal, () => clearTimeout(t)]; }
async function getJSON(url, ms = 9000) {
  const [signal, done] = withTimeout(ms);
  try { const r = await fetch(url, { signal, cache: 'no-store' });
        const txt = await r.text(); let d;
        try { d = JSON.parse(txt); } catch { throw new Error('HTTP ' + r.status + ' (geen JSON)'); }
        if (!r.ok) throw new Error('HTTP ' + r.status + (d && (d.msg || d.message || d.error) ? ': ' + (d.msg || d.message || d.error) : ''));
        return d; }
  finally { done(); }
}
async function getText(url, ms = 9000) {
  const [signal, done] = withTimeout(ms);
  try { const r = await fetch(url, { signal, cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.text(); }
  finally { done(); }
}
const setStatus = (k, s) => { $('s' + k).className = s; };
function ago(t) {
  if (!t || isNaN(t)) return '';
  const m = Math.round((Date.now() - t) / 60000);
  return m < 1 ? 'nu' : m < 60 ? m + ' min' : m < 1440 ? Math.round(m / 60) + ' u' : Math.round(m / 1440) + ' d';
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const stripHTML = s => { const d = document.createElement('div'); d.innerHTML = s || ''; return (d.textContent || '').replace(/\s+/g, ' ').trim(); };
function haversine(a, b, c, d) {
  const R = 6371, k = Math.PI / 180, x = Math.sin((c - a) * k / 2) ** 2 + Math.cos(a * k) * Math.cos(c * k) * Math.sin((d - b) * k / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function bearing(a, b, c, d) {
  const k = Math.PI / 180, y = Math.sin((d - b) * k) * Math.cos(c * k);
  const x = Math.cos(a * k) * Math.sin(c * k) - Math.sin(a * k) * Math.cos(c * k) * Math.cos((d - b) * k);
  return (Math.atan2(y, x) / k + 360) % 360;
}
const COMPASS = ['N','NNO','NO','ONO','O','OZO','ZO','ZZO','Z','ZZW','ZW','WZW','W','WNW','NW','NNW'];
const compass = deg => COMPASS[Math.round(deg / 22.5) % 16];
function beaufort(kmh) { const lim = [1,6,12,20,29,39,50,62,75,89,103,118]; let b = 0; while (b < 12 && kmh >= lim[b]) b++; return b; }
function isoWeek(d) { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); }

/* ===================== ANALOGE KLOK ===================== */
(function buildClock() {
  let s = '<circle cx="50" cy="50" r="48" fill="#fff"/>';
  for (let i = 0; i < 60; i++) {
    const a = i * 6 * Math.PI / 180, big = i % 5 === 0, r1 = big ? 40 : 43, r2 = 45;
    s += '<line x1="' + (50 + r1 * Math.sin(a)) + '" y1="' + (50 - r1 * Math.cos(a)) + '" x2="' + (50 + r2 * Math.sin(a)) + '" y2="' + (50 - r2 * Math.cos(a)) +
         '" stroke="' + (big ? '#1c1c1e' : '#c7c7cc') + '" stroke-width="' + (big ? 1.6 : .7) + '" stroke-linecap="round"/>';
  }
  [12, 3, 6, 9].forEach((n, i) => { const a = i * 90 * Math.PI / 180;
    s += '<text x="' + (50 + 32 * Math.sin(a)) + '" y="' + (50 - 32 * Math.cos(a) + 4) + '" text-anchor="middle" font-size="11" font-weight="600" fill="#1c1c1e" font-family="Inter,sans-serif">' + n + '</text>'; });
  s += '<line id="hH" x1="50" y1="54" x2="50" y2="28" stroke="#1c1c1e" stroke-width="3.4" stroke-linecap="round"/>' +
       '<line id="hM" x1="50" y1="55" x2="50" y2="14" stroke="#1c1c1e" stroke-width="2.4" stroke-linecap="round"/>' +
       '<line id="hS" x1="50" y1="58" x2="50" y2="10" stroke="#ff9f0a" stroke-width="1" stroke-linecap="round"/>' +
       '<circle cx="50" cy="50" r="2.4" fill="#ff9f0a"/><circle cx="50" cy="50" r="1" fill="#fff"/>';
  $('analog').innerHTML = s;
})();

/* ===================== KLOK, KALENDER, NACHTSTAND ===================== */
let dimUntil = 0, dimManual = false;
function tick() {
  const d = new Date(), h = d.getHours(), m = d.getMinutes(), s = d.getSeconds();
  $('hH').setAttribute('transform', 'rotate(' + ((h % 12) * 30 + m * .5) + ' 50 50)');
  $('hM').setAttribute('transform', 'rotate(' + (m * 6 + s * .1) + ' 50 50)');
  $('hS').setAttribute('transform', 'rotate(' + (s * 6) + ' 50 50)');
  $('mbClock').textContent = d.toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' }) + '  ' + hhmm(d);
  $('calDay').textContent = d.toLocaleDateString('nl-NL', { weekday: 'long' });
  $('calNum').textContent = d.getDate();
  $('calMonth').textContent = d.toLocaleDateString('nl-NL', { month: 'long' });
  $('calWeek').textContent = 'week ' + isoWeek(d);
  const night = h >= NIGHT_FROM || h < NIGHT_TO;
  $('dim').classList.toggle('on', Date.now() < dimUntil ? dimManual : night);
}
function toggleDim() { dimManual = !$('dim').classList.contains('on'); dimUntil = Date.now() + 30 * 60e3; tick(); }
$('dimBtn').addEventListener('click', toggleDim);
$('dim').addEventListener('click', toggleDim);

const wmo = (c, day = 1) => { const w = WMO[c] || ['–','·','·','clear']; return { txt: w[0], ico: day ? w[1] : w[2], kind: w[3] }; };

async function loadWeather() {
  const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + HOME.lat + '&longitude=' + HOME.lon +
    '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,is_day,wind_speed_10m,wind_direction_10m,wind_gusts_10m,pressure_msl' +
    '&hourly=temperature_2m,precipitation_probability,weather_code,is_day&minutely_15=precipitation' +
    '&daily=sunrise,sunset,temperature_2m_max,temperature_2m_min&timezone=Europe%2FAmsterdam&forecast_days=2&wind_speed_unit=kmh';
  try {
    const d = await getJSON(url), c = d.current, w = wmo(c.weather_code, c.is_day);
    const box = $('weather');
    box.className = 'w' + (w.kind !== 'clear' ? ' ' + w.kind : '') + (c.is_day ? '' : ' night');
    $('wxTemp').textContent = Math.round(c.temperature_2m) + '°';
    $('wxIcon').textContent = w.ico;
    $('wxDesc').textContent = w.txt;
    $('wxHL').textContent = 'H:' + Math.round(d.daily.temperature_2m_max[0]) + '°  L:' + Math.round(d.daily.temperature_2m_min[0]) + '°';
    const sr = new Date(d.daily.sunrise[0]), ss = new Date(d.daily.sunset[0]);
    $('wxMeta').innerHTML =
      '<span>💨 ' + compass(c.wind_direction_10m) + ' ' + beaufort(c.wind_speed_10m) + ' Bft</span>' +
      '<span>💧 ' + c.relative_humidity_2m + '%</span>' +
            '<span>🌅 ' + hhmm(sr) + ' – ' + hhmm(ss) + '</span>';

    // komende uren
    const now = Date.now(), ht = d.hourly.time.map(t => new Date(t).getTime());
    let h0 = ht.findIndex(t => t > now); if (h0 < 0) h0 = 0;
    let html = '';
    for (let i = h0; i < h0 + 6 && i < ht.length; i++) {
      const hw = wmo(d.hourly.weather_code[i], d.hourly.is_day[i]), p = d.hourly.precipitation_probability[i] ?? 0;
      html += '<div><div class="h">' + pad(new Date(ht[i]).getHours()) + '</div><div class="p">' + (p >= 20 ? p + '%' : '') + '</div>' +
              '<div class="i">' + hw.ico + '</div><div class="t">' + Math.round(d.hourly.temperature_2m[i]) + '°</div></div>';
    }
    $('hourly').innerHTML = html;

    // neerslag komende 2 uur (kwartierdata)
    const mt = d.minutely_15.time.map(t => new Date(t).getTime());
    let i0 = mt.findIndex(t => t + 15 * 60e3 > now); if (i0 < 0) i0 = 0;
    const slots = []; for (let i = i0; i < i0 + 8 && i < mt.length; i++) slots.push({ t: mt[i], p: d.minutely_15.precipitation[i] || 0 });
    const max = Math.max(0, ...slots.map(s => s.p)), scale = Math.max(1, max);
    $('rainBars').innerHTML = slots.map(s => '<div style="height:' + Math.max(6, s.p / scale * 100) + '%;opacity:' + (s.p > 0 ? .95 : .18) + '"></div>').join('');
    $('rainAxis').innerHTML = slots.length ? '<span>' + hhmm(new Date(slots[0].t)) + '</span><span>' + hhmm(new Date(slots[Math.floor(slots.length / 2)].t)) + '</span><span>' + hhmm(new Date(slots[slots.length - 1].t + 15 * 60e3)) + '</span>' : '';
    const wet = s => s.p >= 0.1, firstWet = slots.find(wet), firstDry = slots.find(s => !wet(s));
    $('rainText').textContent = !firstWet ? '☂️ Droog de komende 2 uur'
      : wet(slots[0]) ? (firstDry ? '🌧️ Nu nat, droog rond ' + hhmm(new Date(firstDry.t)) : '🌧️ Nat de komende 2 uur')
      : '🌦️ Regen verwacht rond ' + hhmm(new Date(firstWet.t));
    setStatus('Weather', 'ok');
  } catch (e) { console.warn('weer', e); setStatus('Weather', 'err'); $('wxDesc').textContent = 'weer niet bereikbaar'; }
}

const NOS_RSS = 'https://feeds.nos.nl/nosnieuwsalgemeen';
let news = [], featIdx = 0, newsLoadedAt = 0;
async function fetchRSS(url) {
  try {
    const d = await getJSON('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(url));
    if (d.status !== 'ok' || !d.items || !d.items.length) throw new Error('rss2json: ' + (d.message || 'leeg'));
    return d.items.map(i => ({ title: i.title, desc: stripHTML(i.description), img: (i.enclosure && i.enclosure.link) || i.thumbnail || '',
                               t: new Date((i.pubDate || '').replace(' ', 'T') + 'Z').getTime() }));
  } catch (e) {
    console.warn('rss2json mislukt, probeer allorigins', e);
    const xml = await getText('https://api.allorigins.win/raw?url=' + encodeURIComponent(url));
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    return [...doc.querySelectorAll('item')].map(it => ({
      title: it.querySelector('title')?.textContent || '',
      desc: stripHTML(it.querySelector('description')?.textContent || ''),
      img: it.querySelector('enclosure')?.getAttribute('url') || '',
      t: new Date(it.querySelector('pubDate')?.textContent || '').getTime() }));
  }
}
async function loadNews() {
  try { const items = (await fetchRSS(NOS_RSS)).filter(i => i.title);
        if (items.length) { news = items; featIdx = 0; newsLoadedAt = Date.now(); renderNews(); }
        setStatus('News', 'ok'); }
  catch (e) { console.warn('nieuws', e); setStatus('News', 'err'); if (!news.length) $('featTitle').textContent = 'NOS niet bereikbaar – nieuwe poging over 10 min.'; }
}
function renderNews() {
  if (!news.length) return;
  const nFeat = Math.min(5, news.length), f = news[featIdx % nFeat];
  const fe = $('feat'); fe.classList.remove('fade'); void fe.offsetWidth; fe.classList.add('fade');
  const img = $('featImg');
  if (f.img) { img.style.visibility = 'visible'; img.src = f.img; img.onerror = () => { img.style.visibility = 'hidden'; }; }
  else img.style.visibility = 'hidden';
  $('featTitle').textContent = f.title;
  $('featDesc').textContent = f.desc;
  $('featMeta').textContent = ago(f.t) ? ago(f.t) + ' geleden' : '';
  $('dots').innerHTML = Array.from({ length: nFeat }, (_, i) => '<span class="' + (i === featIdx % nFeat ? 'on' : '') + '"></span>').join('');
  $('newsList').innerHTML = news.filter((_, i) => i !== featIdx % nFeat).slice(0, 7)
    .map(i => '<li><span class="ago">' + esc(ago(i.t)) + '</span><span>' + esc(i.title) + '</span></li>').join('');
  $('newsUpd').textContent = newsLoadedAt ? 'bijgewerkt ' + hhmm(new Date(newsLoadedAt)) : '';
}
$('feat').addEventListener('click', () => { featIdx++; renderNews(); });

let factQueue = [], factTimer, factStart = 0, factFails = 0;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
let localFacts = shuffle(FACTS.slice()), localIdx = 0;
function nextLocalFact() { const f = localFacts[localIdx++ % localFacts.length]; return { kind: 'Nerd-weetje', title: '', text: f }; }

async function onThisDay() {
  const d = new Date(), mm = pad(d.getMonth() + 1), dd = pad(d.getDate());
  let data;
  try { data = await getJSON('https://api.wikimedia.org/feed/v1/wikipedia/nl/onthisday/events/' + mm + '/' + dd); }
  catch { data = await getJSON('https://nl.wikipedia.org/api/rest_v1/feed/onthisday/events/' + mm + '/' + dd); }
  const ev = (data.events || []).filter(e => e.text);
  if (!ev.length) throw new Error('geen events');
  const e = ev[Math.floor(Math.random() * ev.length)], p = (e.pages || [])[0];
  return { kind: 'Op deze dag · ' + e.year, title: '', text: e.text, img: p && p.thumbnail && p.thumbnail.source };
}
async function randomWiki() {
  for (let tries = 0; tries < 4; tries++) {
    const p = await getJSON('https://nl.wikipedia.org/api/rest_v1/page/random/summary');
    if (p.extract && p.extract.length > 120 && p.type === 'standard') return { kind: 'Willekeurig van Wikipedia', title: p.title, text: p.extract, img: p.thumbnail && p.thumbnail.source };
  }
  throw new Error('geen bruikbaar artikel');
}
let factCycle = 0;

  clearTimeout(factTimer);
  const type = factCycle++ % 3; // 0 = nerd-weetje, 1 = op deze dag, 2 = wikipedia

  catch (e) { console.warn('weetje', e); f = nextLocalFact(); setStatus('Facts', 'wait'); }

function normReadsb(a) {
  const ground = a.alt_baro === 'ground';
  const ft = ground ? 0 : (typeof a.alt_baro === 'number' ? a.alt_baro : (typeof a.alt_geom === 'number' ? a.alt_geom : null));
  return { id: a.hex, cs: (a.flight || '').trim() || a.r || a.hex, type: a.t || '', lat: a.lat ?? a.lastPosition?.lat, lon: a.lon ?? a.lastPosition?.lon,
           altM: ft == null ? null : ft * 0.3048, ground, spd: a.gs != null ? a.gs * 1.852 : null,
           trk: a.track ?? a.true_heading ?? a.mag_heading ?? null, vr: a.baro_rate ?? a.geom_rate ?? null };
}
function readsbList(d) {
  const arr = d.ac || d.aircraft;
  if (!Array.isArray(arr)) throw new Error(d.msg || d.message || d.error || 'onverwacht antwoord');
  return arr.map(normReadsb);
}

const SOURCES = [

const SRC_ORDER = ['adsb.fi', 'OpenSky', 'adsb.lol', 'airplanes.live'];
const ROUTES = [];
for (const p of PROXIES) for (const n of SRC_ORDER) ROUTES.push({ src: SOURCES.find(s => s.name === n), proxy: p });

const planes = new Map();

const routeKey = r => r.src.name + '|' + r.proxy.name;
let routeIdx = (() => { try { const k = localStorage.getItem('flRoute'); const i = ROUTES.findIndex(r => routeKey(r) === k); return i >= 0 ? i : null; } catch { return null; } })();
function rememberRoute(i) { routeIdx = i; try { localStorage.setItem('flRoute', routeKey(ROUTES[i])); } catch {} }

// eerste keer: alle routes tegelijk proberen, de snelste wint
async function raceRoutes() {
  try {
    return await Promise.any(ROUTES.map((r, i) => getJSON(r.proxy.wrap(r.src.url()), 9000).then(d => ({ i, list: r.src.parse(d) }))));
  } catch { return null; }
}

async function loadFlights() {
  clearTimeout(flightTimer);
  const errors = []; let list = null, route;
  if (routeIdx == null) {
    $('flMsg').textContent = 'Werkende bron zoeken…';
    const res = await raceRoutes();
    if (res) { rememberRoute(res.i); list = res.list; route = ROUTES[res.i]; }
    else errors.push('geen enkele route gaf antwoord');
  } else {
    for (let tries = 0; tries < ROUTES.length; tries++) {
      route = ROUTES[routeIdx];
      try { list = route.src.parse(await getJSON(route.proxy.wrap(route.src.url()), 7000)); rememberRoute(routeIdx); break; }
      catch (e) { errors.push(route.src.name + ' (' + route.proxy.name + '): ' + (e.name === 'AbortError' ? 'time-out' : e.message)); routeIdx = (routeIdx + 1) % ROUTES.length; }
    }
    if (!list) routeIdx = null; // volgende keer opnieuw racen
  }
  if (list) {
    updatePlanes(list);
    $('flSrc').textContent = 'via ' + route.src.name + (route.proxy.name !== 'direct' ? ' · ' + route.proxy.name : '');
    $('flMsg').textContent = ''; setStatus('Flights', 'ok');
  } else {
    failCount++;
    setStatus('Flights', lastOkAt ? 'wait' : 'err');
    const wait = Math.min(300e3, 30e3 * 2 ** (failCount - 1));
    $('flMsg').innerHTML = lastOkAt
      ? '⏳ Bron even niet bereikbaar. Laatste data van ' + hhmm(new Date(lastOkAt)) + ', nieuwe poging over ' + Math.round(wait / 60e3 * 10) / 10 + ' min.'
      : '⚠️ Geen vluchtdata. ' + errors.slice(-2).map(esc).join('<br>');
  }
  if (list) { failCount = 0; lastOkAt = Date.now(); }
  // via een publieke proxy rustig verversen (30 s), anders word je afgeknepen; bij fouten steeds langer wachten (max 5 min)
  const every = !list ? Math.min(300e3, 30e3 * 2 ** (failCount - 1))
    : Math.max(route.src.every, route.proxy.name === 'direct' || route.proxy.name === 'eigen proxy' ? 0 : 30e3);
  flightTimer = setTimeout(loadFlights, every);
}

/* ---------- herkomst / bestemming / type opzoeken (adsbdb, reserve: hexdb) ---------- */
const INFO_TTL = 12 * 3600e3;
const info = (() => { try { return JSON.parse(localStorage.getItem('flInfo') || '{}'); } catch { return {}; } })();
function saveInfo() {
  try { const now = Date.now(); for (const k in info) if (now - info[k].t > INFO_TTL) delete info[k];
        localStorage.setItem('flInfo', JSON.stringify(info)); } catch {}
}
let infoProxyIdx = 0;
// haalt een URL op, eerst direct en anders via de proxy's; een echte 404 ("onbekend") is een antwoord, geen fout van de proxy
async function viaProxy(url) {
  let lastErr;
  for (let n = 0; n < PROXIES.length; n++) {
    const i = (infoProxyIdx + n) % PROXIES.length;
    try { const d = await getJSON(PROXIES[i].wrap(url), 8000); infoProxyIdx = i; return d; }
    catch (e) { if (/^HTTP 404/.test(e.message || '')) { infoProxyIdx = i; throw e; } lastErr = e; }
  }
  throw lastErr;
}
const place = a => a ? { code: a.iata_code || a.icao_code || '', city: a.municipality || a.name || '' } : null;
async function fetchInfo(p) {
  const out = {};
  const cs = /^[A-Z0-9]{3,8}$/.test(p.cs) && p.cs !== p.id.toUpperCase() ? p.cs : '';
  try {
    const d = await viaProxy('https://api.adsbdb.com/v0/aircraft/' + p.id + (cs ? '?callsign=' + cs : ''));
    const r = d.response || {};
    if (r.aircraft) { out.type = r.aircraft.icao_type || r.aircraft.type; out.reg = r.aircraft.registration; out.owner = r.aircraft.registered_owner; }
    if (r.flightroute) { out.from = place(r.flightroute.origin); out.to = place(r.flightroute.destination); out.airline = r.flightroute.airline && r.flightroute.airline.name; }
  } catch {}
  if (!out.from && cs) {
    try { const d = await viaProxy('https://api.adsbdb.com/v0/callsign/' + cs); const fr = d.response && d.response.flightroute;
          if (fr) { out.from = place(fr.origin); out.to = place(fr.destination); out.airline = fr.airline && fr.airline.name; } } catch {}
  }
  if (!out.from && cs) {
    try { const d = await viaProxy('https://hexdb.io/api/v1/route/icao/' + cs);
          const parts = (d.route || '').split('-'); if (parts.length >= 2) { out.from = { code: parts[0], city: '' }; out.to = { code: parts[parts.length - 1], city: '' }; } } catch {}
  }
  if (!out.type) {
    try { const d = await viaProxy('https://hexdb.io/api/v1/aircraft/' + p.id); out.type = d.ICAOTypeCode; out.reg = out.reg || d.Registration; out.owner = out.owner || d.RegisteredOwners; } catch {}
  }
  return out;
}
const infoQueue = [], queued = new Set();
let infoBusy = false;
function wantInfo(p) {
  const k = p.id + '|' + p.cs;
  if (info[k] || queued.has(k)) return;
  queued.add(k); infoQueue.push(p); pumpInfo();
}
async function pumpInfo() {
  if (infoBusy) return; infoBusy = true;
  while (infoQueue.length) {
    const p = infoQueue.shift(), k = p.id + '|' + p.cs;
    try { info[k] = { t: Date.now(), d: await fetchInfo(p) }; saveInfo(); } catch {}
    queued.delete(k);
    renderSide(); refreshLabel(p.id);
    await new Promise(r => setTimeout(r, 350)); // rustig aan richting de gratis databases
  }
  infoBusy = false;
}
const infoOf = p => (info[p.id + '|' + p.cs] || {}).d || null;
function labelText(p) {
  const i = infoOf(p);
  return p.cs + (i && i.from && i.to ? '  ' + i.from.code + '→' + i.to.code : '');
}
function refreshLabel(id) { const e = planes.get(id); if (e && e.marker.getTooltip()) e.marker.setTooltipContent(labelText(e.p)); }

function updatePlanes(list) {
  const now = Date.now(), seen = new Set();
  list = list.filter(p => typeof p.lat === 'number' && typeof p.lon === 'number');
  for (const p of list) {
    seen.add(p.id);
    p.dist = haversine(HOME.lat, HOME.lon, p.lat, p.lon);
    const col = altColor(p.altM, p.ground);
    let e = planes.get(p.id);
    if (!e) { e = { marker: L.marker([p.lat, p.lon], { icon: planeIcon(p.trk, col), interactive: false }).addTo(map) }; planes.set(p.id, e); }
    else { e.marker.setLatLng([p.lat, p.lon]); if (e.col !== col || Math.abs((e.p.trk || 0) - (p.trk || 0)) > 2) e.marker.setIcon(planeIcon(p.trk, col)); }
    Object.assign(e, { p, t: now, col, base: [p.lat, p.lon] });
    if (p.dist <= LABEL_RADIUS_KM && !p.ground) {
      wantInfo(p);
      if (!e.marker.getTooltip()) e.marker.bindTooltip(labelText(p), { permanent: true, direction: 'right', offset: [10, 0], className: 'plane-label' });
      else e.marker.setTooltipContent(labelText(p));
    } else if (e.marker.getTooltip()) e.marker.unbindTooltip();
  }
  for (const [id, e] of planes) if (!seen.has(id)) { map.removeLayer(e.marker); planes.delete(id); }

  lastAir = list.filter(p => !p.ground);
  renderSide();
}
let lastAir = [];
const AIRLINES = {
  KLM:'KLM', KLC:'KLM Cityhopper', TRA:'Transavia', TVF:'Transavia France', MPH:'Martinair', CND:'Corendon', CAI:'Corendon', TFL:'TUI', TOM:'TUI', JAF:'TUI',
  EZY:'easyJet', EJU:'easyJet', EZS:'easyJet', RYR:'Ryanair', RUK:'Ryanair', MAY:'Ryanair', LDM:'Lauda', WZZ:'Wizz Air', WMT:'Wizz Air', WUK:'Wizz Air',
  BAW:'British Airways', SHT:'British Airways', CFE:'BA CityFlyer', VIR:'Virgin Atlantic', EXS:'Jet2', LOG:'Loganair', EIN:'Aer Lingus', EAI:'Emerald Airlines',
  DLH:'Lufthansa', CLH:'Lufthansa CityLine', EWG:'Eurowings', AFR:'Air France', HOP:'Air France', IBE:'Iberia', IBS:'Iberia Express', VLG:'Vueling', AEA:'Air Europa',
  SWR:'Swiss', AUA:'Austrian', BEL:'Brussels Airlines', SAS:'SAS', NAX:'Norwegian', NSZ:'Norwegian', FIN:'Finnair', ICE:'Icelandair', TAP:'TAP Portugal',
  ITY:'ITA Airways', AEE:'Aegean', LOT:'LOT', CSA:'Czech Airlines', THY:'Turkish Airlines', PGT:'Pegasus', SXS:'SunExpress', ENT:'Enter Air',
  UAE:'Emirates', QTR:'Qatar Airways', ETD:'Etihad', SVA:'Saudia', ELY:'El Al', DAL:'Delta', UAL:'United', AAL:'American Airlines', ACA:'Air Canada',
  CPA:'Cathay Pacific', SIA:'Singapore Airlines', KAL:'Korean Air', CCA:'Air China', CES:'China Eastern', CSN:'China Southern', MAS:'Malaysia Airlines',
  BCS:'DHL', DHK:'DHL', BOX:'AeroLogic', FDX:'FedEx', UPS:'UPS', CLX:'Cargolux', ABR:'ASL Airlines', GEC:'Lufthansa Cargo', CKS:'Kalitta Air',
  NJE:'NetJets', VJT:'VistaJet', RCH:'US Air Force', NATO:'NAVO'
};
function airlineOf(p, i) {
  if (i && i.airline) return i.airline;
  const m = /^([A-Z]{3})\d/.exec(p.cs);
  if (m && AIRLINES[m[1]]) return AIRLINES[m[1]];
  if (/^PH[A-Z]{3}$/.test(p.cs)) return 'Nederlands privétoestel';
  if (i && i.owner) return i.owner;
  return m ? m[1] : 'Onbekend';
}
function renderSide() {
  const air = lastAir.slice();
  const near = air.sort((a, b) => a.dist - b.dist).slice(0, 6);
  near.forEach(wantInfo);
  $('flTable').innerHTML = near.map(p => {
    const i = infoOf(p) || {};
    let route;
    if (i.from && i.to) route = '<b>' + esc(i.from.city || i.from.code) + '</b> → <b>' + esc(i.to.city || i.to.code) + '</b>';
    else route = queued.has(p.id + '|' + p.cs) ? 'route opzoeken…' : 'route onbekend';
    return '<div class="fl">' +
      '<div class="a"><span><span style="color:' + altColor(p.altM) + '">●</span> <span class="cs">' + esc(airlineOf(p, i)) + '</span></span>' +
      '<span class="r">' + esc(p.cs) + '</span></div>' +
      '<div class="b"><span class="route">' + route + '</span></div>' +
      '</div>';
  }).join('') || '<div class="fl" style="color:var(--sub)">Niets in de buurt</div>';
}
// vloeiende beweging tussen updates
setInterval(() => {
  const now = Date.now();
  for (const e of planes.values()) {
    const p = e.p; if (!p || p.ground || p.spd == null || p.trk == null) continue;
    const dt = Math.min(300, (now - e.t) / 1000), dist = p.spd / 3.6 * dt, r = p.trk * Math.PI / 180;
    e.marker.setLatLng([e.base[0] + dist * Math.cos(r) / 111320, e.base[1] + dist * Math.sin(r) / (111320 * Math.cos(e.base[0] * Math.PI / 180))]);
  }
}, 1000);
loadFlights();
}

/* ===================== START ===================== */
tick(); setInterval(tick, 1000);
loadWeather(); setInterval(loadWeather, 10 * 60e3);
loadRadar();   setInterval(() => { radarIdx = 0; loadRadar(); }, 5 * 60e3);
loadNews();    setInterval(loadNews, 10 * 60e3);
setInterval(() => { featIdx++; renderNews(); }, NEWS_FEATURE_SECONDS * 1000);
if (window.L) initFlights();
else { setStatus('Flights', 'err'); $('flMsg').textContent = '⚠️ Kaartbibliotheek kon niet laden – check de internetverbinding.'; setTimeout(() => location.reload(), 60e3); }
setTimeout(() => location.reload(), 6 * 3600e3); // elke 6 uur verse start
</script>
