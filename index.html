<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bureau · Maasdijk</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --fs: 1.5;   /* TEKSTGROOTTE: 1 = klein, 1.5 = standaard, 1.7 = groot */
    --glass: rgba(30,30,34,.52);
    --glass-strong: rgba(24,24,28,.70);
    --stroke: rgba(255,255,255,.12);
    --text: rgba(255,255,255,.94);
    --sub: rgba(235,235,245,.60);
    --faint: rgba(235,235,245,.30);
    --blue:#0a84ff; --orange:#ff9f0a; --red:#ff453a; --green:#30d158; --teal:#64d2ff; --purple:#bf5af2; --yellow:#ffd60a;
    --r: 2.6vh;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;user-select:none}
  html{background:#0b1026}

  /* ---------- wallpaper ---------- */
  #wall{position:fixed;inset:-10%;z-index:-1;
    background:
      radial-gradient(40% 50% at 18% 22%, #3b5bdb 0%, transparent 70%),
      radial-gradient(45% 55% at 82% 18%, #9c36b5 0%, transparent 70%),
      radial-gradient(50% 60% at 70% 88%, #e8590c 0%, transparent 70%),
      radial-gradient(45% 55% at 20% 85%, #0c8599 0%, transparent 70%),
      linear-gradient(160deg,#101a4a,#1a0f3a 55%,#2a1030);
    filter:saturate(1.1);
    animation:drift 120s ease-in-out infinite alternate}
  @keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-3%,2%) scale(1.06)}}

  /* ---------- menubalk ---------- */
  #menubar{height:3.6vh;display:flex;align-items:center;gap:2.2vh;padding:0 1.8vh;font-size:calc(1.65vh*var(--fs));font-weight:500;
    background:rgba(20,20,30,.38);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
    border-bottom:1px solid rgba(255,255,255,.06)}
  #menubar .brand{font-weight:700;display:flex;align-items:center;gap:.8vh}
  #menubar .brand i{width:1.5vh;height:1.5vh;border-radius:50%;background:conic-gradient(var(--teal),var(--purple),var(--orange),var(--teal));display:inline-block}
  #menubar .m{color:rgba(255,255,255,.85);font-weight:400}
  #menubar .grow{flex:1}
  .st{display:flex;align-items:center;gap:.5vh;color:rgba(255,255,255,.75);font-weight:400}
  .st i{width:.8vh;height:.8vh;border-radius:50%;background:#888}
  .st i.ok{background:var(--green)} .st i.err{background:var(--red)} .st i.wait{background:var(--orange)}
  .st .ago{font-size:calc(1.25vh*var(--fs));color:var(--faint);font-variant-numeric:tabular-nums;min-width:3.2vh;display:inline-block}
  #dimBtn{cursor:pointer;font-size:calc(1.9vh*var(--fs));padding:0 .4vh}
  #mbClock{font-variant-numeric:tabular-nums}

  /* ---------- grid ---------- */
  .grid{display:grid;height:calc(100vh - 3.6vh);padding:1.6vh;gap:1.6vh;
    grid-template-columns:27% 1fr; grid-template-rows:58% 1fr;
    grid-template-areas:"left top" "left bottom"}
  .left{grid-area:left;display:flex;flex-direction:column;gap:1.6vh;min-height:0}
  .top{grid-area:top;display:flex;gap:1.6vh;min-height:0}
  .bottom{grid-area:bottom;min-height:0;display:flex}

  .w{background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r);
     backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);
     box-shadow:0 1.2vh 4vh rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.06);
     padding:1.9vh 2.1vh;position:relative;overflow:hidden;min-height:0}
  .wt{font-size:calc(1.45vh*var(--fs));font-weight:600;letter-spacing:.02em;color:var(--sub);text-transform:uppercase;margin-bottom:1vh;display:flex;justify-content:space-between;align-items:center;gap:1vh}
  .wt b{color:var(--text);font-weight:600;text-transform:none;letter-spacing:0}

  /* ---------- klok + kalender ---------- */
  .row2{display:flex;gap:1.6vh;height:19vh;flex:0 0 auto}
  .row2 .w{flex:1;padding:1.4vh;display:flex;align-items:center;justify-content:center}
  #clockW{flex-direction:column;align-items:flex-start!important;justify-content:center!important;padding:1.6vh 2.4vh!important}
  #dClock{font-size:calc(6.6vh*var(--fs));font-weight:300;line-height:1;letter-spacing:-.01em;font-variant-numeric:lining-nums tabular-nums;color:var(--text);white-space:nowrap}
  #dSec{font-size:.42em;font-weight:600;color:var(--orange);margin-left:.4vh;display:inline-block;min-width:1.9em}
  #dDate{font-size:calc(1.75vh*var(--fs));color:var(--sub);margin-top:1vh;white-space:nowrap}
  #dDay{color:var(--orange);font-weight:700;text-transform:capitalize}
  #analog{height:100%;aspect-ratio:1}
  .cal{flex-direction:column;align-items:flex-start!important;justify-content:flex-start!important;padding:1.6vh 1.9vh!important}
  #calDay{color:var(--red);font-weight:700;font-size:calc(1.6vh*var(--fs));text-transform:uppercase;letter-spacing:.04em}
  #calNum{font-size:calc(4.6vh*var(--fs));font-weight:300;line-height:1;margin:.2vh 0}
  #calMonth{font-size:calc(1.75vh*var(--fs));color:var(--sub);text-transform:capitalize}
  #calWeek{font-size:calc(1.45vh*var(--fs));color:var(--faint);margin-top:auto}

  /* ---------- weer (macOS-stijl) ---------- */
  #weather{flex:0 0 auto;height:34vh;display:flex;flex-direction:column;border:none;
    background:linear-gradient(180deg,#2f80ed,#56a0f5);transition:background 2s}
  #weather.night, #vxNow.night{background:linear-gradient(180deg,#0f1b3d,#28396b)}
  #weather.cloudy, #vxNow.cloudy{background:linear-gradient(180deg,#5b6b82,#8495ad)}
  #weather.cloudy.night, #vxNow.cloudy.night{background:linear-gradient(180deg,#232b3b,#414c61)}
  #weather.rain, #vxNow.rain{background:linear-gradient(180deg,#3f4d63,#64748b)}
  #weather.rain.night, #vxNow.rain.night{background:linear-gradient(180deg,#1b2230,#384357)}
  .wx-top{display:flex;justify-content:space-between}
  #wxCity{font-size:calc(2vh*var(--fs));font-weight:600}
  #wxTemp{font-size:calc(5.8vh*var(--fs));font-weight:300;line-height:1;margin-top:.3vh;letter-spacing:-.02em}
  #wxIcon{font-size:calc(4vh*var(--fs));text-align:right}
  #wxDesc{font-size:calc(1.75vh*var(--fs));font-weight:600;text-align:right;margin-top:.4vh}
  #wxHL{font-size:calc(1.75vh*var(--fs));font-weight:500;text-align:right;color:rgba(255,255,255,.85)}
  #wxMeta{display:flex;flex-wrap:wrap;gap:.4vh 1.6vh;white-space:nowrap;font-size:calc(1.5vh*var(--fs));color:rgba(255,255,255,.8);margin-top:.8vh}
  #hourly{flex:1;display:grid;grid-template-columns:repeat(6,1fr);align-items:center;margin-top:1.2vh;text-align:center;border-top:1px solid rgba(255,255,255,.25);padding-top:.6vh}
  #hourly>div{display:flex;flex-direction:column;align-items:center;gap:.5vh}
  #hourly .h{font-size:calc(1.5vh*var(--fs));font-weight:600;color:rgba(255,255,255,.85)}
  #hourly .i{font-size:calc(2.2vh*var(--fs));line-height:1}
  #hourly .t{font-size:calc(1.9vh*var(--fs));font-weight:600}
  #hourly .p{display:none}

  /* ---------- radar + regen ---------- */
  #radarW{flex:1;display:flex;flex-direction:column}
  #radarBox{flex:1;min-height:0;border-radius:1.6vh;overflow:hidden;background:rgba(0,0,0,.25);position:relative}
  #radar{width:100%;height:100%;object-fit:cover;object-position:28% 58%;display:block}
  #radarErr{display:none;position:absolute;inset:0;align-items:center;justify-content:center;color:var(--sub);font-size:calc(1.6vh*var(--fs));text-align:center;padding:2vh}
  #rainText{font-size:calc(1.8vh*var(--fs));font-weight:600;margin-top:1.2vh}
  #rainBars{display:flex;align-items:flex-end;gap:.5vh;height:4.6vh;margin-top:.8vh}
  #rainBars div{flex:1;background:var(--teal);border-radius:.5vh .5vh .15vh .15vh;min-height:3px}
  #rainAxis{display:flex;justify-content:space-between;font-size:calc(1.3vh*var(--fs));color:var(--faint);margin-top:.4vh;font-variant-numeric:tabular-nums}

  /* ---------- nieuws ---------- */
  #newsW{flex:1.55;display:flex;flex-direction:column}
  .news-body{flex:1;display:flex;gap:2vh;min-height:0}
  #feat{flex:0 0 46%;display:flex;flex-direction:column;min-height:0;cursor:pointer}
  #featImg{width:100%;flex:1 1 0;min-height:0;border-radius:1.4vh;object-fit:cover;background:rgba(255,255,255,.06);display:block}
  #featTitle{font-size:calc(2.15vh*var(--fs));font-weight:700;line-height:1.2;margin-top:1.2vh;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;flex:0 0 auto}
  #featDesc{font-size:calc(1.65vh*var(--fs));color:var(--sub);line-height:1.35;margin-top:.7vh;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;flex:0 0 auto}
  #featMeta{font-size:calc(1.4vh*var(--fs));color:var(--faint);padding-top:.8vh}
  #dots{display:flex;gap:.6vh;margin-top:.8vh}
  #dots span{width:.7vh;height:.7vh;border-radius:50%;background:var(--faint)}
  #dots span.on{background:var(--text)}
  #newsList{flex:1;min-height:0;list-style:none;margin:0;padding:0 .6vh 0 0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(17,46,72,.25) transparent}
  #newsList li{padding:1.1vh 0;border-top:1px solid rgba(255,255,255,.08);display:flex;gap:1.4vh;break-inside:avoid}
  #newsList .nt{font-size:calc(1.75vh*var(--fs));line-height:1.25;font-weight:700;color:var(--text)}
  #newsList .nd{font-size:calc(1.45vh*var(--fs));line-height:1.35;color:var(--sub);margin-top:.4vh;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  #newsList li:first-child{border-top:none;padding-top:0}
  #newsList .ago{flex:0 0 7vh;white-space:nowrap;font-size:calc(1.4vh*var(--fs));color:var(--faint);font-weight:500;padding-top:.25vh;font-variant-numeric:tabular-nums}
  .fade{animation:fade .7s ease}
  @keyframes fade{from{opacity:0;transform:translateY(.5vh)}to{opacity:1;transform:none}}
  .nos{background:#e61e14;color:#fff;font-weight:800;font-size:calc(1.3vh*var(--fs));padding:.2vh .7vh;border-radius:.5vh;letter-spacing:.04em}

  /* ---------- weetjes ---------- */
  #factW{flex:1;display:flex;flex-direction:column;cursor:pointer}
  #factKind{font-size:calc(1.45vh*var(--fs));font-weight:600;color:var(--orange)}
  #factImg{width:100%;height:13vh;object-fit:cover;border-radius:1.4vh;margin:1vh 0 0;display:none}
  #factTitle{font-size:calc(2.2vh*var(--fs));font-weight:700;margin-top:1vh;line-height:1.2}
  #factText{font-size:calc(1.85vh*var(--fs));line-height:1.4;margin-top:.8vh;color:rgba(255,255,255,.88);overflow:hidden;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical}
  #factBar{position:absolute;left:2.1vh;right:2.1vh;bottom:1.4vh;height:.35vh;border-radius:1vh;background:rgba(255,255,255,.1);overflow:hidden}
  #factBar div{height:100%;width:0;background:var(--orange);border-radius:1vh}

  /* ---------- vluchten ---------- */
  #flightW{flex:1;padding:0;display:flex}
  #mapWrap{flex:1;position:relative}
  #map{position:absolute;inset:0;background:#0d1117}
  #flSide{flex:0 0 34%;padding:1.8vh 2vh;display:flex;flex-direction:column;background:var(--glass-strong);border-left:1px solid var(--stroke)}
  .flStats{display:flex;gap:2.4vh;margin-bottom:1.2vh}
  .flStats>div{min-width:0}
  .flStats .n{font-size:calc(3.2vh*var(--fs));font-weight:700;line-height:1;white-space:nowrap}
  .flStats .l{font-size:calc(1.3vh*var(--fs));color:var(--sub);margin-top:.3vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:14vh}
  #flTable{font-variant-numeric:tabular-nums;overflow:hidden}
  .fl{padding:.75vh 0;border-top:1px solid rgba(255,255,255,.07)}
  .fl:first-child{border-top:none;padding-top:0}
  .fl .a,.fl .b{display:flex;justify-content:space-between;gap:1vh;white-space:nowrap}
  .fl .a{font-size:calc(1.65vh*var(--fs))}
  .fl .b{font-size:calc(1.45vh*var(--fs));color:var(--sub);margin-top:.25vh}
  .fl .cs{font-weight:700}
  .fl .ty{color:var(--sub);font-weight:400;margin-left:.6vh}
  .fl .route{overflow:hidden;text-overflow:ellipsis}
  .fl .route b{color:var(--text);font-weight:600}
  .fl .r{color:var(--sub)}
  #flMsg{font-size:calc(1.5vh*var(--fs));color:var(--sub);margin-top:auto;padding-top:.6vh}
  .plane-label{background:none;border:none;box-shadow:none;color:#fff;font:600 16px var(--font);text-shadow:0 0 3px #000,0 0 3px #000;padding:0}
  .plane-label:before{display:none}
  .leaflet-control-attribution{background:rgba(0,0,0,.45)!important;color:rgba(255,255,255,.4)!important;font-size:10px!important}
  .leaflet-control-attribution a{color:rgba(255,255,255,.55)!important}
  .legend{position:absolute;left:1.4vh;bottom:1.4vh;z-index:500;display:flex;gap:1.2vh;font-size:calc(1.3vh*var(--fs));padding:.6vh 1.2vh;border-radius:1vh;
    background:rgba(20,20,26,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--stroke)}
  .legend span:before{content:'';display:inline-block;width:.9vh;height:.9vh;border-radius:50%;margin-right:.5vh;background:var(--c)}

  /* ---------- nachtdimmer ---------- */
  #dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 2s;z-index:9999}
  #dim.on{opacity:.72;pointer-events:auto}

  /* ================= PROFLOATING LICHT THEMA ================= */
  :root{
    --pf-orange:#F29201; --pf-navy:#112E48; --pf-blue:#096AD0; --pf-grey:#F0F2F4;
    --glass: rgba(255,255,255,.52);
    --glass-strong: rgba(255,255,255,.70);
    --stroke: rgba(255,255,255,.85);
    --text: #112E48;
    --sub: rgba(17,46,72,.62);
    --faint: rgba(17,46,72,.40);
    --orange: #F29201; --blue: #096AD0; --teal: #096AD0;
    --font: Raleway, Inter, system-ui, sans-serif;
  }
  html{background:var(--pf-grey)}
  body{font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1}
  #wall{inset:0;animation:none;filter:none;
    background:
      radial-gradient(38% 45% at 12% 18%, rgba(9,106,208,.16) 0%, transparent 70%),
      radial-gradient(40% 50% at 88% 12%, rgba(242,146,1,.16) 0%, transparent 70%),
      radial-gradient(45% 50% at 55% 60%, rgba(17,46,72,.07) 0%, transparent 70%),
      var(--pf-grey)}
  #wave{position:fixed;left:0;bottom:0;width:100%;height:45vh;z-index:-1;pointer-events:none;
    background:radial-gradient(70% 90% at 75% 100%, rgba(242,146,1,.42) 0%, rgba(242,146,1,.14) 45%, transparent 75%),
               radial-gradient(60% 70% at 10% 100%, rgba(247,179,71,.28) 0%, transparent 70%)}
  #menubar{background:rgba(255,255,255,.55);border-bottom:1px solid rgba(255,255,255,.9);color:var(--text)}
  #menubar .m{color:var(--sub)}
  #menubar .brand{letter-spacing:.02em}
  #menubar .brand i{background:var(--pf-orange)}
  .st{color:var(--sub)}
  .w{background:var(--glass);border:1px solid var(--stroke);
     box-shadow:0 1vh 3.5vh rgba(17,46,72,.10), inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(17,46,72,.04)}
  .wt{color:var(--sub);font-weight:700}
  #calDay{color:var(--pf-orange)}
  #calNum{color:var(--pf-navy)}
  /* weer: blauw van de huisstijl, 's nachts navy */
  /* dag */
  #weather, #vxNow{background:linear-gradient(160deg,#096AD0 0%,#2b84e6 60%,#5aa2ef 100%);color:#fff}
  #weather.partly, #vxNow.partly{background:linear-gradient(160deg,#1f6fbf 0%,#4f87bd 60%,#86a8c9 100%)}
  #weather.cloudy, #vxNow.cloudy{background:linear-gradient(160deg,#5c7590 0%,#7d93aa 60%,#9fb0c2 100%)}
  #weather.rain, #vxNow.rain{background:linear-gradient(160deg,#2f4d6c 0%,#466683 60%,#62809b 100%)}
  #weather.snow, #vxNow.snow{background:linear-gradient(160deg,#7f9cbc 0%,#a9bfd6 60%,#cfdbe8 100%)}
  #weather.storm, #vxNow.storm{background:linear-gradient(160deg,#112E48 0%,#2a3f57 65%,#5a4a3a 100%);box-shadow:inset 0 -6vh 6vh -3vh rgba(242,146,1,.45),0 1vh 3.5vh rgba(17,46,72,.18)}
  /* nacht */
  #weather.night, #vxNow.night{background:linear-gradient(160deg,#0b1f33 0%,#112E48 55%,#1f4a73 100%)}
  #weather.partly.night, #vxNow.partly.night{background:linear-gradient(160deg,#0f2338 0%,#1d3854 60%,#33506e 100%)}
  #weather.cloudy.night, #vxNow.cloudy.night{background:linear-gradient(160deg,#18283a 0%,#2a3c50 60%,#3e5166 100%)}
  #weather.rain.night, #vxNow.rain.night{background:linear-gradient(160deg,#0a1726 0%,#1a2c40 60%,#2b4158 100%)}
  #weather.snow.night, #vxNow.snow.night{background:linear-gradient(160deg,#1c2f45 0%,#3a5470 60%,#5c7894 100%)}
  #weather.storm.night, #vxNow.storm.night{background:linear-gradient(160deg,#070f1a 0%,#14243a 65%,#3a2c1c 100%);box-shadow:inset 0 -6vh 6vh -3vh rgba(242,146,1,.5),0 1vh 3.5vh rgba(17,46,72,.18)}
  /* regen/onweer: oranje accent op de temperatuurregel */
  #weather.rain #wxDesc, #weather.storm #wxDesc, #vxNow.rain #wxDesc, #vxNow.storm #wxDesc{color:#ffc164}
  #weather, #weather *, #vxNow, #vxNow *{color:#fff}
  #hourly .p{color:#ffd28a!important}
  #radarBox{background:rgba(17,46,72,.06)}
  #rainBars div{background:var(--pf-orange)}
  #newsList li{border-top-color:rgba(17,46,72,.10)}
  #featImg{background:rgba(17,46,72,.06)}
  #dots span{background:rgba(17,46,72,.2)} #dots span.on{background:var(--pf-orange)}
  #featTitle{color:var(--pf-navy)}
  #flSide{background:var(--glass-strong);border-left:1px solid rgba(255,255,255,.9)}
  .fl{border-top-color:rgba(17,46,72,.10)}
  .fl .route b{color:var(--pf-navy)}
  #map{background:#e9ecef}
  .plane-label{color:var(--pf-navy);text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff}
  .leaflet-control-attribution{background:rgba(255,255,255,.6)!important;color:rgba(17,46,72,.5)!important}
  .leaflet-control-attribution a{color:rgba(17,46,72,.65)!important}
  .legend{background:rgba(255,255,255,.7);color:var(--text)}
  #dim{background:#0b1a2a}

  /* labels zoals op adsb.lol, in huisstijl */
  .leaflet-tooltip.plane-label{background:rgba(255,255,255,.9)!important;border:1px solid rgba(17,46,72,.18)!important;border-radius:6px!important;
    box-shadow:0 1px 4px rgba(17,46,72,.18)!important;padding:2px 6px!important;color:#112E48!important;text-shadow:none!important;
    font:600 12px Raleway,Inter,sans-serif!important;line-height:1.15!important;white-space:nowrap}
  .plane-label b{display:block;font-weight:800;font-size:12.5px}
  .plane-label span{display:block;font-weight:600;color:rgba(17,46,72,.7);font-size:11.5px}
  .plane-label .bdg{font-style:normal;font-size:9px;font-weight:800;padding:0 4px;border-radius:3px;margin-left:4px;vertical-align:1px;color:#fff}
  .plane-label .bdg.pol{background:#096AD0} .plane-label .bdg.mil{background:#4b5d23}
  .plane-label b{display:inline}
  .plane-label b+span,.plane-label i+span{display:block}
  #legend{align-items:center;gap:.8vh}
  #legend .lg-bar{display:inline-block;width:16vh;height:.9vh;border-radius:1vh}
  #legend span:before{display:none}

  /* ---------- radarmodus ---------- */
  #menubar .m{cursor:pointer;padding:.2vh .8vh;border-radius:.8vh}
  #menubar .m.on{background:rgba(17,46,72,.08);color:var(--text);font-weight:700}
  body.radar .left, body.radar .top{display:none}
  body.radar .grid{grid-template-columns:1fr;grid-template-rows:1fr;grid-template-areas:"bottom"}
  body.radar #flSide{flex-basis:30%}
  #modeBtn{position:absolute;top:1.4vh;left:1.4vh;z-index:600;width:4.4vh;height:4.4vh;border-radius:1.2vh;display:flex;align-items:center;justify-content:center;
    font-size:calc(1.9vh*var(--fs));cursor:pointer;color:var(--text);background:rgba(255,255,255,.8);border:1px solid rgba(17,46,72,.15);box-shadow:0 1px 4px rgba(17,46,72,.15)}

  /* nieuws */

  #nvImg{width:100%;height:38vh;object-fit:cover;border-radius:1.6vh;background:rgba(17,46,72,.06);flex:0 0 auto}

<script>
/* ===================== INSTELLINGEN ===================== */
const HOME = { lat: 51.957, lon: 4.212, name: 'Maasdijk' };
const FLIGHT_RADIUS_NM = 40;          // straal voor vliegtuigen (zeemijl, ~74 km)
const LABEL_RADIUS_KM = 40;           // callsign-labels binnen deze afstand
const NIGHT_FROM = 23, NIGHT_TO = 7;  // automatisch dimmen
const FACT_SECONDS = 50;              // hoe lang een weetje blijft staan
const NEWS_FEATURE_SECONDS = 15;      // hoe lang een uitgelicht nieuwsbericht blijft staan

/* ===================== HULPFUNCTIES ===================== */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const hhmm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
function withTimeout(ms) { const c = new AbortController(); const t = setTimeout(() => c.abort(), ms); return [c.signal, () => clearTimeout(t)]; }
async function getJSON(url, ms = 9000) {
  const [signal, done] = withTimeout(ms);
  try { const r = await fetch(url, { signal, cache: 'no-store' });
        const txt = await r.text(); let d;
        try { d = JSON.parse(txt); } catch { throw new Error('HTTP ' + r.status + ' (geen JSON)'); }
        if (!r.ok) throw new Error('HTTP ' + r.status + (d && (d.msg || d.message || d.error) ? ': ' + (d.msg || d.message || d.error) : ''));
        return d; }
  finally { done(); }
}
async function getText(url, ms = 9000) {
  const [signal, done] = withTimeout(ms);
  try { const r = await fetch(url, { signal, cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.text(); }
  finally { done(); }
}
const lastOk = {};
const setStatus = (k, s) => { $('s' + k).className = s; if (s === 'ok') lastOk[k] = Date.now(); };
function shortAgo(t) { const s = Math.round((Date.now() - t) / 1000); return s < 60 ? s + 's' : s < 3600 ? Math.floor(s / 60) + 'm' : Math.floor(s / 3600) + 'u'; }
function ago(t) {
  if (!t || isNaN(t)) return '';
  const m = Math.round((Date.now() - t) / 60000);
  return m < 1 ? 'nu' : m < 60 ? m + ' min' : m < 1440 ? Math.round(m / 60) + ' u' : Math.round(m / 1440) + ' d';
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
function paragraphs(html) { const d = document.createElement('div'); d.innerHTML = html || ''; const ps = [...d.querySelectorAll('p')].map(p => p.textContent.trim()).filter(Boolean); return ps.length ? ps : [(d.textContent || '').trim()].filter(Boolean); }
function stripHTML(s) { const d = document.createElement('div'); d.innerHTML = s || ''; return (d.textContent || '').replace(/\s+/g, ' ').trim(); }
function haversine(a, b, c, d) {
  const R = 6371, k = Math.PI / 180, x = Math.sin((c - a) * k / 2) ** 2 + Math.cos(a * k) * Math.cos(c * k) * Math.sin((d - b) * k / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function bearing(a, b, c, d) {
  const k = Math.PI / 180, y = Math.sin((d - b) * k) * Math.cos(c * k);
  const x = Math.cos(a * k) * Math.sin(c * k) - Math.sin(a * k) * Math.cos(c * k) * Math.cos((d - b) * k);
  return (Math.atan2(y, x) / k + 360) % 360;
}
const COMPASS = ['N','NNO','NO','ONO','O','OZO','ZO','ZZO','Z','ZZW','ZW','WZW','W','WNW','NW','NNW'];
const compass = deg => COMPASS[Math.round(deg / 22.5) % 16];
function beaufort(kmh) { const lim = [1,6,12,20,29,39,50,62,75,89,103,118]; let b = 0; while (b < 12 && kmh >= lim[b]) b++; return b; }
function isoWeek(d) { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); }


/* ===================== KLOK, KALENDER, NACHTSTAND ===================== */
let dimUntil = 0, dimManual = false;
function tick() {
  const d = new Date(), h = d.getHours(), m = d.getMinutes(), s = d.getSeconds();
  $('dClock').firstChild.nodeValue = hhmm(d);
  $('dSec').textContent = ':' + pad(s);
  $('dDay').textContent = d.toLocaleDateString('nl-NL', { weekday: 'long' });
  $('dRest').textContent = d.getDate() + ' ' + d.toLocaleDateString('nl-NL', { month: 'long' }) + ' · week ' + isoWeek(d);
  $('mbClock').textContent = d.toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' }) + '  ' + hhmm(d);
  for (const k of ['Weather', 'Radar', 'News', 'Flights']) { const el = $('t' + k); if (el) el.textContent = lastOk[k] ? shortAgo(lastOk[k]) : ''; }
  const night = h >= NIGHT_FROM || h < NIGHT_TO;
  $('dim').classList.toggle('on', Date.now() < dimUntil ? dimManual : night);
}
function toggleDim() { dimManual = !$('dim').classList.contains('on'); dimUntil = Date.now() + 30 * 60e3; tick(); }
$('dimBtn').addEventListener('click', toggleDim);
$('dim').addEventListener('click', toggleDim);

/* ===================== WEER (Open-Meteo) ===================== */
const WMO = {
  0:['Onbewolkt','☀️','🌙','clear'],1:['Overwegend helder','🌤️','🌙','clear'],2:['Half bewolkt','⛅','☁️','partly'],3:['Bewolkt','☁️','☁️','cloudy'],
  45:['Mist','🌫️','🌫️','cloudy'],48:['Rijpmist','🌫️','🌫️','cloudy'],
  51:['Lichte motregen','🌦️','🌧️','rain'],53:['Motregen','🌦️','🌧️','rain'],55:['Dichte motregen','🌧️','🌧️','rain'],
  56:['Lichte ijzel','🌧️','🌧️','rain'],57:['IJzel','🌧️','🌧️','rain'],61:['Lichte regen','🌧️','🌧️','rain'],63:['Regen','🌧️','🌧️','rain'],65:['Zware regen','🌧️','🌧️','rain'],
  66:['Lichte ijzel','🌧️','🌧️','rain'],67:['IJzel','🌧️','🌧️','rain'],71:['Lichte sneeuw','🌨️','🌨️','snow'],73:['Sneeuw','🌨️','🌨️','snow'],75:['Zware sneeuw','❄️','❄️','snow'],
  77:['Korrelsneeuw','🌨️','🌨️','snow'],80:['Lichte buien','🌦️','🌧️','rain'],81:['Buien','🌧️','🌧️','rain'],82:['Zware buien','⛈️','⛈️','rain'],
  85:['Sneeuwbuien','🌨️','🌨️','snow'],86:['Zware sneeuwbuien','❄️','❄️','snow'],95:['Onweer','⛈️','⛈️','storm'],96:['Onweer met hagel','⛈️','⛈️','storm'],99:['Zwaar onweer','⛈️','⛈️','storm']
};
const wmo = (c, day = 1) => { const w = WMO[c] || ['–','·','·','clear']; return { txt: w[0], ico: day ? w[1] : w[2], kind: w[3] }; };

async function loadWeather() {
  const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + HOME.lat + '&longitude=' + HOME.lon +
    '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,is_day,wind_speed_10m,wind_direction_10m,wind_gusts_10m,pressure_msl,cloud_cover' +
    '&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,is_day&minutely_15=precipitation' +
    '&daily=sunrise,sunset,temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max,precipitation_sum,wind_speed_10m_max,uv_index_max&timezone=Europe%2FAmsterdam&forecast_days=7&wind_speed_unit=kmh';
  try {
    const d = await getJSON(url), c = d.current, w = wmo(c.weather_code, c.is_day);
    const box = $('weather');
    box.className = 'w' + (w.kind !== 'clear' ? ' ' + w.kind : '') + (c.is_day ? '' : ' night');
    $('wxTemp').textContent = Math.round(c.temperature_2m) + '°';
    $('wxIcon').textContent = w.ico;
    $('wxDesc').textContent = w.txt;
    $('wxHL').textContent = 'H:' + Math.round(d.daily.temperature_2m_max[0]) + '°  L:' + Math.round(d.daily.temperature_2m_min[0]) + '°';
    const sr = new Date(d.daily.sunrise[0]), ss = new Date(d.daily.sunset[0]);
    $('wxMeta').innerHTML =
      '<span>💨 ' + compass(c.wind_direction_10m) + ' ' + beaufort(c.wind_speed_10m) + ' Bft</span>' +
      '<span>💧 ' + c.relative_humidity_2m + '%</span>' +
            '<span>🌅 ' + hhmm(sr) + ' – ' + hhmm(ss) + '</span>';

    // komende uren
    const now = Date.now(), ht = d.hourly.time.map(t => new Date(t).getTime());
    let h0 = ht.findIndex(t => t > now); if (h0 < 0) h0 = 0;
    let html = '';
    for (let i = h0; i < h0 + 6 && i < ht.length; i++) {

async function loadFlights() {
  clearTimeout(flightTimer);

    $('flMsg').textContent = 'Werkende bron zoeken…';
    const res = await raceRoutes();
    if (res) { rememberRoute(res.i); list = res.list; route = ROUTES[res.i]; }
    else errors.push('geen enkele route gaf antwoord');
  } else {
    for (let tries = 0; tries < ROUTES.length; tries++) {
      route = ROUTES[routeIdx];
      try { list = route.src.parse(await getJSON(route.proxy.wrap(route.src.url()), 7000)); rememberRoute(routeIdx); break; }
      catch (e) { errors.push(route.src.name + ' (' + route.proxy.name + '): ' + (e.name === 'AbortError' ? 'time-out' : e.message)); routeIdx = (routeIdx + 1) % ROUTES.length; }

    updatePlanes(list);
    $('flSrc').textContent = 'via ' + route.src.name;
    $('flMsg').textContent = ''; setStatus('Flights', 'ok');

      if (!e.marker.getTooltip()) e.marker.bindTooltip(labelHTML(p), { permanent: true, direction: 'right', offset: [12, 0], className: 'plane-label', interactive: true });

/* ---------- spoor (trail) via adsb.lol ---------- */
let trailLayer = null, trailFor = null, trailLast = null;
function clearTrail() { if (trailLayer) map.removeLayer(trailLayer); trailLayer = null; trailFor = null; trailLast = null; }
function trailSeg(a, b, altFt) {
  const ground = altFt === 'ground';
  L.polyline([a, b], { color: altColor(ground ? 0 : altFt * 0.3048, ground), weight: 3.5, opacity: .9, lineCap: 'round', interactive: false }).addTo(trailLayer);
}
async function showTrail(hex) {
  clearTrail();
  trailFor = hex;
  trailLayer = L.layerGroup().addTo(map);
  const h = String(hex).toLowerCase(), base = 'https://adsb.lol/data/traces/' + h.slice(-2) + '/';
  const get = f => { const u = base + f + h + '.json'; return getJSON(MY_PROXY ? MY_PROXY + encodeURIComponent(u) : u, 9000).catch(() => null); };
  const [full, rec] = await Promise.all([get('trace_full_'), get('trace_recent_')]);
  if (trailFor !== hex || !trailLayer) return;
  let pts = [];
  const push = (tr, minT) => { if (!tr || !Array.isArray(tr.trace)) return; for (const q of tr.trace) { const t = tr.timestamp + q[0]; if (t > minT && typeof q[1] === 'number') pts.push({ t, lat: q[1], lon: q[2], alt: q[3], f: q[6] || 0 }); } };
  push(full, 0);

  let s0 = 0;
  for (let i = pts.length - 1; i > 0; i--) { if (pts[i - 1].alt === 'ground' || (pts[i].f & 2) || pts[i].t - pts[i - 1].t > 1200) { s0 = i - (pts[i - 1].alt === 'ground' ? 1 : 0); break; } }
  pts = pts.slice(Math.max(0, s0));

  let prev = pts[0];
  for (let i = step; i < pts.length; i += step) { trailSeg([prev.lat, prev.lon], [pts[i].lat, pts[i].lon], pts[i].alt); prev = pts[i]; }

  if (prev !== last) trailSeg([prev.lat, prev.lon], [last.lat, last.lon], last.alt);

}
// laat het spoor live meegroeien met nieuwe posities
function growTrail() {
  if (!trailLayer || !trailLast || !selectedId) return;
  const e = planes.get(selectedId); if (!e) return;
  const p = e.p, cur = [p.lat, p.lon];
  if (Math.abs(cur[0] - trailLast[0]) + Math.abs(cur[1] - trailLast[1]) < 1e-5) return;
  trailSeg(trailLast, cur, p.ground ? 'ground' : (p.altM == null ? 0 : p.altM / 0.3048));
  trailLast = cur;
}

    svg += '<text x="' + X(i) + '" y="' + (Y(T[i]) - 13) + '" text-anchor="middle" font-size="19" font-weight="800" fill="#112E48">' + Math.round(T[i]) + '°</text>';
    svg += '<text x="' + X(i) + '" y="36" text-anchor="middle" font-size="25">' + wmo(C[i], D[i]).ico + '</text>';
    if (PP[i] >= 20) svg += '<text x="' + X(i) + '" y="60" text-anchor="middle" font-size="14" font-weight="700" fill="#096AD0">' + PP[i] + '%</text>';
    svg += '<text x="' + X(i) + '" y="' + (yBase + 28) + '" text-anchor="middle" font-size="15" font-weight="700" fill="rgba(17,46,72,.55)">' + (i === 0 ? 'nu' : pad(H[i]) + 'u') + '</text>';
    svg += '<circle cx="' + X(i) + '" cy="' + Y(T[i]) + '" r="4.5" fill="#fff" stroke="#F29201" stroke-width="2.5"/>';
  }
  svg += '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + yBase + '" y2="' + yBase + '" stroke="rgba(17,46,72,.15)"/></svg>';
  $('vxChart').innerHTML = svg;
  const totP = P.reduce((a, b) => a + b, 0);
  $('vxHoursSub').textContent = totP >= 0.1 ? totP.toFixed(1).replace('.', ',') + ' mm regen' : 'droog';

  // 7 dagen
  const dd = d.daily, lo = Math.min(...dd.temperature_2m_min), hi = Math.max(...dd.temperature_2m_max), rng = Math.max(1, hi - lo);
  $('vxDayList').innerHTML = dd.time.map((t, i) => {
    const day = i === 0 ? 'Vandaag' : new Date(t + 'T12:00').toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric' });
    const mn = dd.temperature_2m_min[i], mx = dd.temperature_2m_max[i], pr = dd.precipitation_probability_max ? dd.precipitation_probability_max[i] : 0;
    return '<div class="dy"><span>' + day + '</span><span class="ic">' + wmo(dd.weather_code[i], 1).ico + '</span><span class="pr">' + (pr >= 20 ? '💧' + pr + '%' : '') + '</span>' +
      '<span class="lo">' + Math.round(mn) + '°</span><span class="bar"><i style="left:' + ((mn - lo) / rng * 100) + '%;width:' + Math.max(4, (mx - mn) / rng * 100) + '%"></i></span><span>' + Math.round(mx) + '°</span></div>';
  }).join('');

  // regen 2 uur (zelfde als het kleine blok)
  $('vxRainText').textContent = $('rainText').textContent;
  $('vxRainBars').innerHTML = $('rainBars').innerHTML;
  $('vxRainAxis').innerHTML = $('rainAxis').innerHTML;
}

function renderNewsView() {
  if (!news.length) return;
  nvIdx = Math.max(0, Math.min(nvIdx, news.length - 1));
  $('nvList').innerHTML = news.slice(0, 30).map((i, n) =>
    '<li data-i="' + n + '" class="' + (n === nvIdx ? 'on' : '') + '"><span class="ago">' + esc(ago(i.t)) + '</span><span>' + esc(i.title) + '</span></li>').join('');
  $('nvUpd').textContent = newsLoadedAt ? 'bijgewerkt ' + hhmm(new Date(newsLoadedAt)) : '';
  const a = news[nvIdx];
  const img = $('nvImg');
  if (a.img) { img.style.display = 'block'; img.onerror = () => { img.style.display = 'none'; }; if (img.dataset.src !== a.img) { img.src = a.img; img.dataset.src = a.img; } } else img.style.display = 'none';
  $('nvMeta').textContent = (ago(a.t) === 'nu' ? 'zojuist' : ago(a.t) ? ago(a.t) + ' geleden' : '') + (a.t && !isNaN(a.t) ? ' · ' + new Date(a.t).toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' }) : '');
  $('nvTitle').textContent = a.title;
  if ($('nvArtW').dataset.idx !== String(nvIdx)) { $('nvArtW').scrollTop = 0; $('nvArtW').dataset.idx = String(nvIdx); }
  $('nvDesc').innerHTML = (a.paras && a.paras.length ? a.paras : [a.desc]).map(p => '<p>' + esc(p) + '</p>').join('');
}
$('nvList').addEventListener('click', e => { const li = e.target.closest('li'); if (li) { nvIdx = +li.dataset.i; renderNewsView(); } });

/* ===================== MODI: DASHBOARD / WEER / NIEUWS / RADAR ===================== */
const MODES = { dash: '', weer: 'v-weer', nieuws: 'v-news', radar: 'radar' };
const modeFromHash = () => { const h = location.hash.slice(1); return Object.prototype.hasOwnProperty.call(MODES, h) ? h : 'dash'; };
const HOME_MODE = modeFromHash();
let idleTimer;
// na IDLE_MINUTES niet aanraken: alles terug naar een schone start
function idleReset() {
  if (curMode !== HOME_MODE) setMode(HOME_MODE);
  if (window.__flReset) window.__flReset();          // selectie weg, spoor weg, kaart terug op Maasdijk
  nvIdx = 0;
  for (const id of ['newsList', 'nvList', 'nvArtW']) { const el = $(id); if (el) el.scrollTop = 0; }
}
function resetIdle() { clearTimeout(idleTimer); idleTimer = setTimeout(idleReset, IDLE_MINUTES * 60e3); }
function setMode(m) {
  if (!Object.prototype.hasOwnProperty.call(MODES, m)) m = 'dash';
  curMode = m;
  for (const c of Object.values(MODES)) if (c) document.body.classList.remove(c);
  if (MODES[m]) document.body.classList.add(MODES[m]);
  document.querySelectorAll('#menubar .m').forEach(el => el.classList.toggle('on', el.dataset.mode === m));
  if ($('modeBtn')) $('modeBtn').textContent = m === 'radar' ? '⤡' : '⤢';
  try { history.replaceState(null, '', m === 'dash' ? location.pathname + location.search : '#' + m); } catch {}
  if (m === 'weer') { renderWeerView(); if (!$('vxRadar').getAttribute('src')) loadBigRadar(); }
  if (m === 'nieuws') renderNewsView();
  setTimeout(() => window.__flRefresh && window.__flRefresh(), 60);
  resetIdle();
}
document.querySelectorAll('#menubar .m').forEach(el => el.addEventListener('click', () => setMode(el.dataset.mode)));
document.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', () => setMode('dash')));
if ($('modeBtn')) $('modeBtn').addEventListener('click', ev => { ev.stopPropagation(); setMode(curMode === 'radar' ? 'dash' : 'radar'); });
$('weather').addEventListener('click', () => setMode('weer'));
$('radarW').addEventListener('click', () => setMode('weer'));
$('newsW').addEventListener('click', e => { const li = e.target.closest('li[data-i]'); nvIdx = li ? +li.dataset.i : 0; setMode('nieuws'); });
['pointerdown', 'wheel', 'keydown'].forEach(ev => document.addEventListener(ev, resetIdle, { capture: true, passive: true }));
window.addEventListener('hashchange', () => { const m = modeFromHash(); if (m !== curMode) setMode(m); });
setMode(HOME_MODE);

/* ===================== START ===================== */
tick(); setInterval(tick, 1000);
loadWeather(); setInterval(loadWeather, 10 * 60e3);
loadRadar();   setInterval(() => { radarIdx = 0; loadRadar(); }, 5 * 60e3);
loadNews();    setInterval(loadNews, 10 * 60e3);
setInterval(renderNews, 60e3); // 'x min geleden' bijwerken
if (window.L) initFlights();
else { setStatus('Flights', 'err'); $('flMsg').textContent = '⚠️ Kaartbibliotheek kon niet laden – check de internetverbinding.'; setTimeout(() => location.reload(), 60e3); }
setTimeout(() => location.reload(), 6 * 3600e3); // elke 6 uur verse start
</script>
